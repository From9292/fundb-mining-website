name: Publish FundB testnet deployer

on:
  push:
    branches:
      - fundb-contract-audit-tests
    paths:
      - "deploy/**"
      - ".github/workflows/publish-fundb-deployer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fundb-testnet-deployer-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployer page
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload testnet deployer site
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
