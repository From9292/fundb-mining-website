name: FundB code checks

on:
  pull_request:
    branches: [main, fundb-production-hardening, fundb-wallet-foundation]
  push:
    branches: [main, fundb-production-hardening, fundb-mission-submissions-hardening-2026-11-22, fundb-wallet-foundation]

jobs:
  appwrite-function:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Appwrite function dependencies
        run: npm install --prefix appwrite-function --ignore-scripts --no-audit --no-fund
      - name: Check function syntax
        run: node --check appwrite-function/index.js
      - name: Verify function module loads
        run: node -e "require('./appwrite-function/index.js')"
      - name: Run mocked Appwrite safety tests
        run: node --test appwrite-function/test/*.test.js
      - name: Check embedded website JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script([^>]*)>(.*?)</script>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No embedded JavaScript blocks were found")
          for number, (attributes, source) in enumerate(scripts, start=1):
              is_module = 'type="module"' in attributes.lower() or "type='module'" in attributes.lower()
              suffix = ".mjs" if is_module else ".js"
              with tempfile.NamedTemporaryFile("w", suffix=suffix, encoding="utf-8") as handle:
                  handle.write(source)
                  handle.flush()
                  subprocess.run(["node", "--check", handle.name], check=True)
              print(f"Embedded script {number}: syntax OK")
          PY
      - name: Verify Appwrite function execution is authenticated-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readme = Path("appwrite-function/README.md").read_text(encoding="utf-8")
          source = Path("appwrite-function/index.js").read_text(encoding="utf-8")
          expected = 'Function execution access: `Users` (authenticated Appwrite users only; never `Any`)'
          if expected not in readme:
              raise SystemExit("Appwrite function execution must be documented for authenticated users only.")
          if "Function execution access: `Any`" in readme:
              raise SystemExit("Public function execution must not be recommended.")
          if "x-appwrite-user-jwt" not in source or "'/account'" not in source:
              raise SystemExit("Server-side Appwrite JWT verification must remain enabled.")
          print("Authenticated-only function execution and server-side JWT verification are documented.")
          PY
      - name: Verify authenticated mission submission UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          backend = Path("appwrite-function/index.js").read_text(encoding="utf-8")
          required_html = [
              'onclick="submitMissionLive(1)"',
              'onclick="submitMissionLive(5)"',
              "JSON.stringify({ action: 'submitMission'",
              "JSON.stringify({ action: 'myMissionSubmissions' })",
              "await account.get()",
              "pending review",
              'maxlength="2000"',
              "window.submitMissionLive"
          ]
          missing = [item for item in required_html if item not in html]
          if missing:
              raise SystemExit("Mission UI is not connected to authenticated submissions: " + ", ".join(missing))
          required_backend = [
              "'submitMission'",
              "'myMissionSubmissions'",
              "userId: user.$id",
              "status: 'pending'",
              "MISSION_UNIQUE_INDEX_MISCONFIGURED"
          ]
          missing = [item for item in required_backend if item not in backend]
          if missing:
              raise SystemExit("Mission API safety boundary is incomplete: " + ", ".join(missing))
          if "Preview submission saved on this device only" in html or "submitMissionPreview" in html:
              raise SystemExit("Old local-only mission preview handler is still present")
          print("Mission UI calls the authenticated API; pending rewards remain disabled.")
          PY

      - name: Verify authenticated read-only transaction history UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="viewTransactionsBtn" type="button">Refresh transaction history',
              "JSON.stringify({ action: 'transactionHistory' })",
              "functions.createExecution(",
              "await loadTransactionHistory()",
              "byId('viewTransactionsBtn').addEventListener('click', loadTransactionHistory)",
              "transactionHistoryLoading"
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Transaction-history integration is incomplete: " + ", ".join(missing))
          for unsafe in ["action: 'createTransaction'", "action: 'withdraw'", "action: 'transfer'", "action: 'deposit'"]:
              if unsafe in source:
                  raise SystemExit("Wallet history UI must not activate financial actions: " + unsafe)
          print("Authenticated transaction-history refresh is wired; financial actions remain unavailable")
          PY

      - name: Verify reward safety switches remain disabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          required = [
              "function active(){return false}",
              "function accrued(){return 0}",
              "$('claimBtn').disabled=true",
              "mineBtn').disabled=true"
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Safety check failed; missing: " + ", ".join(missing))
          print("Unverified local rewards remain disabled")
          PY

      - name: Verify mining stays locked and AdSense is non-incentivized
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="adCount2">0 / 10',
              'id="mineBtn" style="width:100%" disabled',
              'Rewarded ads are not yet available.',
              'AdSense publisher account',
              'Viewing or clicking ordinary website ads will never increase mining progress or FUNDB balances.',
              'google-adsense-account" content="ca-pub-9800579782167167'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Mining/advertising separation check failed: " + ", ".join(missing))
          verification = 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9800579782167167'
          if verification not in html:
              raise SystemExit("AdSense site-verification script is missing from the main page.")
          if "data-ad-slot=" in html:
              raise SystemExit("Do not add live ad units before site approval and a valid ad-unit ID are confirmed.")
          print("Mining remains disabled; AdSense verification is installed, and no live ad units or incentivized ads are enabled.")
          PY
      - name: Verify current public programme disclosures and reward restrictions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              "Explore missions",
              "AdSense publisher verification script is present",
              "no ad units are installed",
              "No streaming rewards are currently issued",
              "FUNDB balances are community tracking units only"
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Current public wording check failed: " + ", ".join(missing))
          forbidden = [
              "No AdSense ad unit or serving script is installed",
              "The proposed 35 FundB Points per eligible hour"
          ]
          present = [item for item in forbidden if item in html]
          if present:
              raise SystemExit("Outdated or misleading preview wording remains: " + ", ".join(present))
          print("Preview earning, AdSense and points-reference wording is accurate.")
          PY
      - name: Verify referral and CORS hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("appwrite-function/index.js").read_text(encoding="utf-8")
          required = [
              "require('crypto')",
              "crypto.randomBytes(8)",
              "createUniqueReferralCode(tablePath, adminHeaders)",
              "const ALLOWED_ORIGINS = new Set(",
              "ALLOWED_ORIGINS.has(origin)",
              "Access-Control-Allow-Origin'] = origin"
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Backend hardening check failed; missing: " + ", ".join(missing))
          if "Access-Control-Allow-Origin'] = '*'" in source or "Access-Control-Allow-Origin': '*'" in source:
              raise SystemExit("Wildcard CORS is not permitted")
          print("Cryptographic referral codes and exact-origin allowlist checks passed")

      - name: Verify referral attribution is explicit and idempotent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          frontend = Path("index.html").read_text(encoding="utf-8")
          backend = Path("appwrite-function/index.js").read_text(encoding="utf-8")
          if "referralCodeOverride || referralFromUrl" in frontend:
              raise SystemExit("A login or profile refresh could silently submit a stale referral code")
          if "String(referralCodeOverride || '').trim().toUpperCase()" not in frontend:
              raise SystemExit("Referral code must be passed explicitly by the registration flow")
          if "eligibleReferrer.$id) + '/total_referrals/increment'" in backend:
              raise SystemExit("Existing-profile referral attribution must not blindly increment counters")
          if "Reconciled inviter referral counter after saving existing-profile attribution" not in backend:
              raise SystemExit("Missing idempotent referral counter reconciliation")
          print("Referral submission is explicit and existing-profile counts are idempotent")
          PY
      - name: Validate PWA assets and basic HTML integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json

          class IntegrityParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.unsafe_blank_links = 0
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.append(attrs["id"])
                  if tag.lower() == "a" and attrs.get("target") == "_blank":
                      rel = set((attrs.get("rel") or "").lower().split())
                      if "noopener" not in rel:
                          self.unsafe_blank_links += 1

          html = Path("index.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          if not manifest.get("name") or not manifest.get("start_url") or not manifest.get("display"):
              raise SystemExit("PWA manifest is missing required install metadata")
          if not Path("sw.js").is_file() or not Path("assets/fundb-logo.png").is_file():
              raise SystemExit("A required service-worker or app-logo asset is missing")

          parser = IntegrityParser()
          parser.feed(html)
          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          if parser.unsafe_blank_links:
              raise SystemExit("External links opened in new tabs must include rel=noopener")

          print("PWA manifest, required assets, unique HTML IDs and external-link safety checks passed")
          PY
      - name: Check service-worker syntax
        run: node --check sw.js

      - name: Verify public legal pages and app links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          privacy = Path("privacy.html")
          terms = Path("terms.html")
          if not privacy.is_file() or not terms.is_file():
              raise SystemExit("Both legal pages must exist.")
          for link in ['href="./privacy.html"', 'href="./terms.html"']:
              if link not in html:
                  raise SystemExit("App navigation/footer is missing legal link: " + link)
          if "Live FUNDB deposits, transfers, withdrawals and token claims are not available" not in terms.read_text(encoding="utf-8"):
              raise SystemExit("Terms must clearly disclose that live wallet and token services are unavailable.")
          print("Privacy and terms files exist and are linked from the app source.")
          PY
