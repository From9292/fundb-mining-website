name: FundB code checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fundb-production-hardening]

jobs:
  appwrite-function:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Appwrite function dependencies
        run: npm install --prefix appwrite-function --ignore-scripts --no-audit --no-fund
      - name: Check function syntax
        run: node --check appwrite-function/index.js
      - name: Verify function module loads
        run: node -e "require('./appwrite-function/index.js')"
      - name: Run mocked Appwrite safety tests
        run: node --test appwrite-function/test/*.test.js
      - name: Check embedded website JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script([^>]*)>(.*?)</script>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No embedded JavaScript blocks were found")
          for number, (attributes, source) in enumerate(scripts, start=1):
              is_module = 'type="module"' in attributes.lower() or "type='module'" in attributes.lower()
              suffix = ".mjs" if is_module else ".js"
              with tempfile.NamedTemporaryFile("w", suffix=suffix, encoding="utf-8") as handle:
                  handle.write(source)
                  handle.flush()
                  subprocess.run(["node", "--check", handle.name], check=True)
              print(f"Embedded script {number}: syntax OK")
          PY
      - name: Verify reward safety switches remain disabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          required = [
              "function active(){return false}",
              "function accrued(){return 0}",
              "$('claimBtn').disabled=true",
              "mineBtn').disabled=true"
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Safety check failed; missing: " + ", ".join(missing))
          print("Unverified local rewards remain disabled")
          PY

      - name: Verify referral and CORS hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("appwrite-function/index.js").read_text(encoding="utf-8")
          required = [
              "require('crypto')",
              "crypto.randomBytes(8)",
              "createUniqueReferralCode(tablePath, adminHeaders)",
              "const ALLOWED_ORIGINS = new Set(",
              "ALLOWED_ORIGINS.has(origin)",
              "Access-Control-Allow-Origin'] = origin"
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Backend hardening check failed; missing: " + ", ".join(missing))
          if "Access-Control-Allow-Origin'] = '*'" in source or "Access-Control-Allow-Origin': '*'" in source:
              raise SystemExit("Wildcard CORS is not permitted")
          print("Cryptographic referral codes and exact-origin allowlist checks passed")

      - name: Verify referral attribution is explicit and idempotent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          frontend = Path("index.html").read_text(encoding="utf-8")
          backend = Path("appwrite-function/index.js").read_text(encoding="utf-8")
          if "referralCodeOverride || referralFromUrl" in frontend:
              raise SystemExit("A login or profile refresh could silently submit a stale referral code")
          if "String(referralCodeOverride || '').trim().toUpperCase()" not in frontend:
              raise SystemExit("Referral code must be passed explicitly by the registration flow")
          if "eligibleReferrer.$id) + '/total_referrals/increment'" in backend:
              raise SystemExit("Existing-profile referral attribution must not blindly increment counters")
          if "Reconciled inviter referral counter after saving existing-profile attribution" not in backend:
              raise SystemExit("Missing idempotent referral counter reconciliation")
          print("Referral submission is explicit and existing-profile counts are idempotent")
          PY
      - name: Validate PWA assets and basic HTML integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          if not manifest.get("name") or not manifest.get("start_url") or not manifest.get("display"):
              raise SystemExit("PWA manifest is missing required install metadata")
          if not Path("sw.js").is_file() or not Path("assets/fundb-logo.png").is_file():
              raise SystemExit("A required service-worker or app-logo asset is missing")

          ids = re.findall(r'\\bid=["\\']([^"\\']+)["\\']', html, flags=re.I)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))

          unsafe_links = re.findall(
              r'<a\\b(?=[^>]*target=["\\']_blank["\\'])(?![^>]*rel=["\\'][^"\\']*noopener)[^>]*>',
              html, flags=re.I
          )
          if unsafe_links:
              raise SystemExit("External links opened in new tabs must include rel=noopener")

          secret_patterns = [
              r'(?i)secret[_-]?key\\s*[:=]\\s*["\\'][^"\\']{12,}',
              r'(?i)api[_-]?key\\s*[:=]\\s*["\\'][A-Za-z0-9_-]{24,}',
              r'(?i)private[_-]?key\\s*[:=]\\s*["\\'][^"\\']{20,}'
          ]
          tracked = [Path("index.html"), Path("appwrite-function/index.js")]
          for path in tracked:
              source = path.read_text(encoding="utf-8")
              for pattern in secret_patterns:
                  if re.search(pattern, source):
                      raise SystemExit(f"Possible hard-coded credential pattern in {path}")

          print("PWA manifest, required assets, unique HTML IDs, external-link safety and credential-pattern checks passed")
          PY
      - name: Check service-worker syntax
        run: node --check sw.js
