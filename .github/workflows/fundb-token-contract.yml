name: FundB token contract tests

on:
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "hardhat.config.ts"
      - "package.json"
      - ".github/workflows/fundb-token-contract.yml"
  push:
    branches:
      - fundb-contract-foundation
      - fundb-hardhat3-security-migration

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
      - name: Use npm with Hardhat 3 lockfile support
        run: npm install --global npm@11.6.2
      - name: Resolve exact dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install from generated lockfile
        run: npm ci --ignore-scripts --no-audit
      - name: Compile contracts
        run: npm run compile
      - name: Run contract tests
        run: npm test
      - name: Enforce clean dependency audit
        run: npm audit --audit-level=low
