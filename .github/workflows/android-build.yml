name: FundB Android build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  push:
    branches:
      - fundb-android-foundation
      - fundb-production-hardening
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run Android security smoke checks
        working-directory: android
        run: python3 scripts/security_smoke_test.py
      - name: Assemble preview APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: fundb-android-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release-build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-build]'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is empty"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is empty"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is empty"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is empty"; exit 1; }

          KEYSTORE_B64="$(printf "%s" "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          echo "Keystore secret character count: ${#KEYSTORE_B64}"
          if [[ ! "$KEYSTORE_B64" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 contains characters outside standard Base64. Re-copy the original Base64 file into this GitHub secret."
            exit 1
          fi

          if ! printf "%s" "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fundb-release-key.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 has invalid Base64 padding or length."
            exit 1
          fi
          test -s "$RUNNER_TEMP/fundb-release-key.jks" || { echo "::error::Decoded keystore file is empty"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/fundb-release-key.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/fundb-release-key.jks" >> "$GITHUB_ENV"
      - name: Run Android security smoke checks
        working-directory: android
        run: python3 scripts/security_smoke_test.py
      - name: Build signed production APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Upload signed production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fundb-production-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
