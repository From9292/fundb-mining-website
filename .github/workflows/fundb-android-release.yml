name: FundB Android signed release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate release identity and signing configuration
        env:
          RELEASE_APPLICATION_ID: ${{ vars.FUNDB_RELEASE_APPLICATION_ID }}
          KEYSTORE_BASE64: ${{ secrets.FUNDB_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FUNDB_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FUNDB_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FUNDB_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_APPLICATION_ID" || "$RELEASE_APPLICATION_ID" == "com.fundb.mining.preview" ]]; then
            echo "::error::Set FUNDB_RELEASE_APPLICATION_ID to the final, unique Android package ID. Preview IDs are blocked."
            exit 1
          fi
          if [[ ! "$RELEASE_APPLICATION_ID" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "::error::The release application ID is not a valid Android package name."
            exit 1
          fi
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub secret for release signing: $name"
              exit 1
            fi
          done

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode private signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FUNDB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fundb-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fundb-signing/fundb-release.jks"
          chmod 600 "$RUNNER_TEMP/fundb-signing/fundb-release.jks"

      - name: Build signed Android App Bundle
        working-directory: android
        env:
          FUNDB_RELEASE_STORE_FILE: ${{ runner.temp }}/fundb-signing/fundb-release.jks
          FUNDB_RELEASE_STORE_PASSWORD: ${{ secrets.FUNDB_RELEASE_STORE_PASSWORD }}
          FUNDB_RELEASE_KEY_ALIAS: ${{ secrets.FUNDB_RELEASE_KEY_ALIAS }}
          FUNDB_RELEASE_KEY_PASSWORD: ${{ secrets.FUNDB_RELEASE_KEY_PASSWORD }}
          RELEASE_APPLICATION_ID: ${{ vars.FUNDB_RELEASE_APPLICATION_ID }}
        run: |
          set -euo pipefail
          gradle --no-daemon bundleRelease "-PreleaseApplicationId=$RELEASE_APPLICATION_ID"

      - name: Upload signed release candidate (not published)
        uses: actions/upload-artifact@v4
        with:
          name: fundb-android-signed-aab-candidate
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
