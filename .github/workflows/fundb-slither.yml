name: FundB Solidity static analysis

on:
  push:
    branches:
      - fundb-contract-audit-tests
    paths:
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'hardhat.config.ts'
      - '.github/workflows/fundb-slither.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'hardhat.config.ts'
      - '.github/workflows/fundb-slither.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    name: Run Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Run official Slither analyzer
        uses: crytic/slither-action@v0.4.2
        with:
          node-version: 22.13.0
