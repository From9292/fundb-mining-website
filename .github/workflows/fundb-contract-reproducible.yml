name: FundB reproducible contract verification

on:
  push:
    branches:
      - fundb-contract-audit-tests
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.ts'
      - '.github/workflows/fundb-contract-reproducible.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"

      - name: Use npm with Hardhat 3 lockfile support
        run: npm install --global npm@11.6.2

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit reproducible lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: commit reproducible FundB contract lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile Solidity
        run: npm run compile

      - name: Run contract regression tests
        run: npm test

      - name: Enforce clean dependency security audit
        run: npm audit --audit-level=low
