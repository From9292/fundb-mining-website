name: FundB reproducible contract verification

on:
  push:
    branches:
      - fundb-contract-audit-tests
    paths:
      - 'package.json'
      - 'contracts/**'
      - 'test/**'
      - 'hardhat.config.js'
      - '.github/workflows/fundb-contract-reproducible.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile Solidity
        run: npx hardhat compile

      - name: Run contract regression tests
        run: npx hardhat test

      - name: Audit dependency tree
        run: npm audit --audit-level=high

      - name: Upload generated lockfile for review
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fundb-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14
