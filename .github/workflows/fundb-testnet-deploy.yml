name: FundB testnet deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Select DEPLOY_TESTNET only when you intend to deploy to BSC testnet
        required: true
        type: choice
        options:
          - NO
          - DEPLOY_TESTNET

permissions:
  contents: read

concurrency:
  group: fundb-bsc-testnet-deployment
  cancel-in-progress: false

jobs:
  deploy-testnet:
    if: ${{ inputs.confirm_deployment == 'DEPLOY_TESTNET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main branch source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile contract
        run: npm run compile
      - name: Run contract tests
        run: npm test
      - name: Deploy to BNB Smart Chain Testnet and verify token state
        env:
          BSC_TESTNET_PRIVATE_KEY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
        run: npx hardhat run scripts/deploy.ts --network bscTestnet
